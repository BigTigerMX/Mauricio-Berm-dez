# Publica el sitio en GitHub Pages empujando la rama `gh-pages`.
#
# POR QUÉ ASÍ Y NO CON LA API DE PAGES. `actions/configure-pages` con
# `enablement: true` falla en este repositorio con «Resource not accessible by
# integration»: el GITHUB_TOKEN tiene permiso de Pages y aun así no puede
# CREAR el sitio. Empujar una rama `gh-pages` sí lo enciende —lo encendió— y
# además no depende de ningún permiso especial: sólo de escribir en el repo.
#
# QUÉ SE PUBLICA Y QUÉ NO. Se arma una carpeta aparte en vez de servir la raíz:
# `taller/` lleva los generadores y `cv/` los editables. Nada de eso tiene por
# qué quedar colgado en una dirección pública. Se copia sólo lo que el sitio
# pide, y un paso de comprobación aborta si se cuela algo o si se perdió el
# noindex.
name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Armar la carpeta del sitio
        run: |
          set -e
          mkdir -p _sitio
          cp index.html retrato.webp tarjeta-social.jpg _sitio/
          cp cv-maurice-valdes-bermudez-es.pdf _sitio/
          cp cv-maurice-valdes-bermudez-en.pdf _sitio/
          # Sin esto Jekyll se come cualquier archivo que empiece por guion bajo.
          touch _sitio/.nojekyll
          echo "Contenido publicado:"; ls -la _sitio

      - name: Comprobar que no se cuela nada privado
        run: |
          set -e
          for prohibido in revision hacer_revision cv-original README taller; do
            if find _sitio -iname "*${prohibido}*" | grep -q .; then
              echo "ABORTADO: «$prohibido» no puede publicarse"; exit 1
            fi
          done
          test -f _sitio/index.html
          grep -q "noindex" _sitio/index.html || { echo "ABORTADO: falta el noindex"; exit 1; }
          echo "Nada privado en la carpeta, y el noindex sigue puesto."

      - name: Empujar a gh-pages
        run: |
          set -e
          cd _sitio
          git init -q
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sitio desde ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
