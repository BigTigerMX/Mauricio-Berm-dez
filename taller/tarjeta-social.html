<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#F4F2EF;color:#0D0D0D;

.fi{position:absolute;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:600;

.ceja{font:500 13px/1 "JetBrains Mono",monospace;letter-spacing:.17em;text-transform:uppercase;

p{margin-top:26px;font-size:24px;font-weight:500;letter-spacing:-.03em;color:#56514F;max-width:30ch}
.pie{position:absolute;left:78px;bottom:46px;display:flex;align-items:center;gap:13px;z-index:2}
.pie i{width:34px;height:34px;border-radius:10px;background:#0D0D0D;display:grid;place-items:center}
.pie b{font-size:17px;font-weight:700;letter-spacing:-.04em}
.pie s{text-decoration:none;color:#6B6361;font:500 13px/1 "JetBrains Mono",monospace;
  letter-spacing:.1em;margin-left:6px}
</style></head><body>
